      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="100%" stop-color="#140b07"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2b17a"/>
      <stop offset="100%" stop-color="#a46d38"/>
