services:
  web:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://recetas:recetas@db:5432/recetas
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recetas
      POSTGRES_USER: recetas
      POSTGRES_PASSWORD: recetas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recetas -d recetas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
