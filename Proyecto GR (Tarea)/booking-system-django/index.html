<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sistema de Reservas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:grid;place-items:center;min-height:100vh;margin:0}
main{max-width:520px;padding:2rem;text-align:center}
a.btn{display:inline-block;background:#3b82f6;color:#fff;padding:.8rem 1.6rem;border-radius:8px;text-decoration:none;font-weight:600;margin:.4rem}
code{background:#1e293b;padding:.2rem .5rem;border-radius:4px}
#msg{color:#fbbf24}
</style>
</head>
<body>
<main>
  <h1>Sistema de Reservas</h1>
  <p id="msg">Comprobando servidor…</p>
  <a class="btn" href="http://127.0.0.1:8000/">Entrar a la web</a>
  <a class="btn" href="http://127.0.0.1:8000/login/">Iniciar sesión</a>
  <a class="btn" href="http://127.0.0.1:8000/admin/">Admin</a>
  <p>Si no carga, haz doble clic en <code>iniciar.bat</code> (en esta misma carpeta) y recarga esta página.</p>
</main>
<script>
const U="http://127.0.0.1:8000/";
fetch(U,{mode:"no-cors"}).then(()=>{document.getElementById("msg").textContent="Servidor activo, redirigiendo…";location.href=U;})
.catch(()=>{document.getElementById("msg").textContent="El servidor no está encendido.";});
</script>
</body>
</html>
